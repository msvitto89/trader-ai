services:
  - type: web
    name: tradia-ai
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      # Free instances have an ephemeral filesystem; /tmp is the only writable
      # path. scripts/bootstrap.mjs re-provisions the account on each boot.
      - key: TRADIA_DB_PATH
        value: /tmp/tradia.db
      - key: TRADIA_SESSION_SECRET
        generateValue: true
      # Optional overrides. The image ships with a working account
      # (trader@tradia.ai / TradiaPro2026!) so no variables are required.
      - key: PROVISION_EMAIL
        sync: false
      - key: PROVISION_PASSWORD
        sync: false
      - key: SEED_SAMPLE_DATA
        value: "1"
      - key: SEED_PLAN
        value: "pro"
      - key: MARKET_DATA_PROVIDER
        value: demo
